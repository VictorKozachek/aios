# AIOS: конфигурация Limine для M0 (UEFI x86-64).
#
# Файл кладётся в корень ESP-образа (см. build/mkimage.sh). Limine ищет
# конфиг в порядке: <каталог EFI-приложения>/limine.conf, /EFI/BOOT/limine.conf,
# /boot/limine/limine.conf, /boot/limine.conf, /limine/limine.conf, /limine.conf;
# нам достаточно последнего варианта.
#
# Путь boot():/ — это раздел, с которого загружен сам limine.conf (наш образ).

# Автозагрузка: одна секунда, чтобы успеть заметить меню при отладке.
timeout: 1

# Продублировать вывод загрузчика в COM1 — иначе в serial.log не видно,
# что Limine вообще стартовал.
serial: yes
serial_baudrate: 115200

# Единственная запись меню: наше ядро по протоколу Limine.
/AIOS kernel (x86-64, Limine protocol)
    protocol: limine
    path: boot():/boot/kernel

