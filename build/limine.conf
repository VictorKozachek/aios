# AIOS: конфигурация Limine для M0 (UEFI x86-64).
#
# Файл кладётся в корень ESP-образа (см. build/mkimage.sh). Limine ищет
# конфиг в порядке: <каталог EFI-приложения>/limine.conf, /EFI/BOOT/limine.conf,
# /boot/limine/limine.conf, /boot/limine.conf, /limine/limine.conf, /limine.conf;
# нам достаточно последнего варианта.
#
# Путь boot():/ — это раздел, с которого загружен сам limine.conf (наш образ).

# Автозагрузка: три секунды — хватает прочитать брендинг (spec §10.1).
timeout: 3
default_entry: 1

# Разрешение интерфейса меню; должно совпадать с resolution пункта ядра.
interface_resolution: 1280x800

# Фон меню: wallpaper кладётся в FAT-образ как /wallpaper.jpg (mkimage.sh).
wallpaper: boot():/wallpaper.jpg
wallpaper_style: stretched

# Продублировать вывод загрузчика в COM1 — иначе в serial.log не видно,
# что Limine вообще стартовал.
serial: yes
serial_baudrate: 115200

# Брендинг и палитра меню загрузчика (spec §10.1, v1 «Void»).
interface_branding: AIOS · SkyNet v0.0.1
interface_branding_colour: E8EEF9
interface_help_colour: 6E7F99
interface_help_colour_bright: 86A9FF
interface_help_hidden: yes

# Полупрозрачная тёмная подложка терминала меню.
term_background: 6605080E
term_foreground: D7DEE9
term_margin: 64
term_margin_gradient: 4
term_palette:        05070C;C06A6A;7FA98F;A98F6A;86A9FF;A68FD0;7FB8C9;6B7A91
term_palette_bright: 2A3444;E08585;9FD0B0;D9C08A;A8C4FF;C4AEDC;A8D8E6;E8EEF9

# Единственная запись меню: наше ядро по протоколу Limine.
/AIOS kernel (x86-64, Limine protocol)
    protocol: limine
    path: boot():/boot/kernel
    # Должно совпадать с interface_resolution (spec §10.1), иначе Limine
    # переключит видеорежим на handoff.
    resolution: 1280x800x32

